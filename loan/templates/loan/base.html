<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MTN MoMo Salary Advance{% endblock %}</title>
    {% load static %}
    <style>
        :root {
            --mtn-yellow: #FFCC00;
            --mtn-yellow-dark: #E6B800;
            --mtn-black: #000000;
            --mtn-dark: #1a1a1a;
            --mtn-gray: #2d2d2d;
            --bg-light: #f8f8f8;
            --text-dark: #1a1a1a;
            --text-muted: #555;
            --card-shadow: 0 8px 28px rgba(0,0,0,0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, 'Helvetica Neue', sans-serif;
            background-color: var(--bg-light);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Top header - MTN MoMo style */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px 14px;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            border-bottom: 4px solid var(--mtn-yellow);
            width: 100%;
            max-width: 410px;
            margin: 0 auto 1.5rem;
            border-radius: 0 0 12px 12px;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .momo-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .momo-logo .mtn-badge {
            background: var(--mtn-yellow);
            color: #000;
            font-weight: 900;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .momo-logo .momo-text {
            color: #fff;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.5px;
        }

        .welcome-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .welcome-block svg {
            width: 28px;
            height: 28px;
            stroke: var(--mtn-yellow);
        }

        .welcome-block h1 {
            font-size: 13px;
            margin: 0;
            color: #fff;
            font-weight: 600;
        }

        /* Main container */
        .loan-calculator-container {
            max-width: 410px;
            margin: 0 auto;
            padding: 0 15px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .calculator-header {
            text-align: center;
            margin-bottom: 16px;
            color: var(--mtn-dark);
            padding: 8px 0;
            width: 100%;
        }

        .calculator-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.4px;
            line-height: 1.3;
            color: var(--mtn-dark);
        }

        .fast-text {
            color: var(--mtn-yellow-dark);
            background: linear-gradient(90deg, #FFCC00, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }

        .subtitle {
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: 500;
            letter-spacing: 0.2px;
            color: var(--text-muted);
            padding: 0 8px;
        }

        .calculator-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            width: 100%;
            border-top: 3px solid var(--mtn-yellow);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--mtn-dark);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .calculator-control {
            margin-bottom: 18px;
        }

        .control-label {
            display: block;
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .amount-display {
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--mtn-dark);
            margin-bottom: 10px;
        }

        .slider-container {
            position: relative;
            margin-top: 6px;
        }

        .amount-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(to right, #FFCC00, #FFD700);
            border-radius: 3px;
            outline: none;
        }

        .amount-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #000;
            border: 3px solid var(--mtn-yellow);
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
        }

        .amount-slider::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #000;
            border: 3px solid var(--mtn-yellow);
            cursor: pointer;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .term-display {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--mtn-dark);
            margin-bottom: 10px;
        }

        .term-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .term-button {
            padding: 10px 6px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #444;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .term-button:hover {
            background: #eee;
            border-color: #ccc;
        }

        .term-button.active {
            background: linear-gradient(135deg, #FFCC00, #FFD700);
            color: #000;
            border-color: transparent;
            box-shadow: 0 3px 10px rgba(255, 204, 0, 0.4);
            font-weight: 800;
        }

        .payment-display {
            margin-top: 8px;
            padding: 16px;
            background: linear-gradient(135deg, #fffef5, #fff9e6);
            border-radius: 12px;
            text-align: center;
            border: 2px solid #ffe066;
            margin-bottom: 8px;
        }

        .payment-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .payment-amount {
            font-size: 2rem;
            font-weight: 900;
            color: var(--mtn-dark);
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .interest-rate {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .apply-button {
            margin-top: 12px;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #000000, #1a1a1a);
            color: var(--mtn-yellow);
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 5px 18px rgba(0,0,0,0.25);
        }

        .apply-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.35);
            background: linear-gradient(135deg, #1a1a1a, #000);
        }

        .features-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .feature-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: linear-gradient(135deg, #fffef8, #fff9e6);
            border-radius: 12px;
            border: 1.5px solid #ffe566;
            transition: all 0.2s ease;
        }

        .feature-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.2);
        }

        .feature-icon {
            font-size: 1.3rem;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #000, #222);
            border-radius: 50%;
            color: var(--mtn-yellow);
            flex-shrink: 0;
        }

        .feature-content {
            flex: 1;
            text-align: left;
        }

        .feature-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--mtn-dark);
            margin-bottom: 2px;
        }

        .feature-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.3;
        }

        /* Shared form styles */
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 410px;
            padding: 28px 22px;
            margin: 0 auto;
            border-top: 3px solid var(--mtn-yellow);
        }

        .card-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .card-header h2 {
            color: var(--mtn-dark);
            font-size: 1.4rem;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--mtn-dark);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--mtn-yellow);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.2);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #000000, #1a1a1a);
            color: var(--mtn-yellow);
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-secondary {
            flex: 1;
            background: #f0f0f0;
            border: none;
            padding: 14px;
            border-radius: 10px;
            color: #444;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.9rem;
        }

        .card.wide {
            max-width: 520px;
        }

        .back-btn {
            background: rgba(0,0,0,0.08);
            color: var(--mtn-dark);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .pin-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 18px 0;
        }

        .pin-inputs input {
            width: 48px;
            height: 48px;
            text-align: center;
            font-size: 1.2rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            color: var(--mtn-dark);
            font-weight: bold;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px 40px;
            width: 100%;
        }

        .footer {
            background-color: var(--mtn-black);
            color: rgba(255, 255, 255, 0.75);
            font-size: 11px;
            text-align: center;
            padding: 12px;
            width: 100%;
            max-width: 410px;
            margin: 20px auto 0;
            border-radius: 8px;
            border-top: 2px solid var(--mtn-yellow);
        }

        .badge-momo {
            display: inline-block;
            background: var(--mtn-yellow);
            color: #000;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.3px;
            margin-left: 6px;
            vertical-align: middle;
        }

        @media (min-width: 700px) {
            .calculator-content {
                grid-template-columns: 1.2fr 0.8fr;
                gap: 24px;
                padding: 24px;
                max-width: 720px;
            }
            .loan-calculator-container {
                max-width: 760px;
            }
            .top-header {
                max-width: 760px;
            }
            .features-section {
                justify-content: center;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block full_page %}
    <div class="loan-calculator-container">
        <header class="top-header">
            <a href="{% url 'calculator' %}" class="momo-logo">
                <span class="mtn-badge">MTN</span>
                <span class="momo-text">MoMo</span>
            </a>
            <div class="welcome-block">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFCC00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <h1>Welcome</h1>
            </div>
        </header>

        {% block content %}{% endblock %}

        <div class="footer">
            MTN MoMo Salary Advance • Powered by MTN Mobile Money
        </div>
    </div>
    {% endblock %}
</body>
</html>
